services:
  web:
    build:
      context: ./project
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./project:/rails
      - ./class_members.json:/class_members.json:ro
      - ./classes.json:/classes.json:ro
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development

volumes:
  bundle_cache:
